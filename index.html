<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="サイクラ最適化" />
  <title>サイクラ完全非プロキシ最適化 (iPhone Edition)</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #121826;
      --card-sub: #1a2234;
      --border: #283248;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.16);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.16);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      padding-top: calc(64px + var(--safe-top));
      padding-bottom: calc(78px + var(--safe-bottom));
      overscroll-behavior-y: none;
    }

    button, input, select, textarea {
      font-family: inherit;
      touch-action: manipulation;
    }

    .app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      padding: calc(8px + var(--safe-top)) 14px 8px;
      background: rgba(18, 24, 38, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-row { display: flex; align-items: center; gap: 7px; }
    .grixis-dots { display: inline-flex; gap: 3px; }
    .grixis-dots span { width: 9px; height: 9px; border-radius: 50%; }
    .dot-u { background: #2563eb; }
    .dot-b { background: #475569; border: 1px solid #94a3b8; }
    .dot-r { background: #dc2626; }

    .header-title { font-size: 13px; font-weight: 700; color: var(--muted); }
    .header-cost { font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
    .header-badges { display: flex; align-items: center; gap: 6px; }

    .pill {
      display: inline-flex; align-items: center;
      padding: 3px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
      background: var(--card-sub); border: 1px solid var(--border); color: var(--text);
      white-space: nowrap;
    }
    .pill-blue { background: var(--blue-bg); border-color: rgba(59,130,246,0.45); color: #93c5fd; }
    .pill-green { background: var(--green-bg); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }
    .pill-amber { background: var(--amber-bg); border-color: rgba(245,158,11,0.45); color: #fcd34d; }

    .container { max-width: 720px; margin: 0 auto; padding: 12px 12px 24px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }

    .section-title {
      font-size: 14px; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }

    .sub-text { font-size: 12px; color: var(--muted); line-height: 1.5; }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .kpi-label { font-size: 11px; color: var(--muted); }
    .kpi-val { font-size: 17px; font-weight: 800; margin-top: 2px; }
    .kpi-note { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .preset-list { display: flex; flex-direction: column; gap: 7px; }
    .preset-btn {
      width: 100%; background: var(--card-sub); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 12px; color: var(--text);
      display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer;
    }
    .preset-btn.selected { border-color: var(--blue); background: var(--blue-bg); }
    .preset-name { font-size: 13px; font-weight: 700; }
    .preset-desc { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .preset-price { font-size: 13px; font-weight: 800; color: #6ee7b7; margin-left: 8px; white-space: nowrap; }

    .slider-block { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .slider-label { font-size: 13px; font-weight: 600; }
    .slider-val { font-size: 16px; font-weight: 800; color: #6ee7b7; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 8px;
      background: #263147; border-radius: 999px; outline: none; margin: 8px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 26px; height: 26px;
      border-radius: 50%; background: #10b981; border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45); cursor: pointer;
    }

    .stepper-row { display: flex; gap: 6px; margin-top: 6px; }
    .btn-sm {
      flex: 1; min-height: 36px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-sub); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; padding: 6px 10px;
    }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #ffffff; }
    .btn-green { background: var(--green-bg); border-color: rgba(16,185,129,0.5); color: #6ee7b7; }

    .toggle-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid rgba(40, 50, 72, 0.6); cursor: pointer;
    }
    .toggle-row:last-child { border-bottom: none; padding-bottom: 0; }
    .toggle-row input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--green); flex-shrink: 0; }

    .diag-item { border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 12px; }
    .diag-item:last-child { margin-bottom: 0; }
    .diag-ok { background: var(--green-bg); border-color: rgba(16,185,129,0.4); }
    .diag-info { background: var(--blue-bg); border-color: rgba(59,130,246,0.4); }
    .diag-title { font-weight: 700; margin-bottom: 3px; color: #ffffff; }

    .swap-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 9px; }
    .swap-top { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .swap-out { font-size: 12px; color: #fca5a5; text-decoration: line-through; }
    .swap-in { font-size: 14px; font-weight: 700; color: #6ee7b7; }
    .swap-reason { font-size: 12px; color: #cbd5e1; background: var(--card-sub); padding: 8px 10px; border-radius: 8px; margin-bottom: 9px; }
    .swap-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

    .search-input {
      width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-sub); color: var(--text); outline: none; margin-bottom: 9px;
    }

    .cat-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
    .cat-chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .chip-btn.active { background: var(--green); border-color: var(--green); color: #090d16; }

    .deck-group-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 4px 5px; }
    .deck-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 11px;
      padding: 9px 11px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .deck-item-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .owned-check-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 36px; min-height: 38px; cursor: pointer; }
    .owned-check-wrap input { width: 20px; height: 20px; accent-color: var(--green); }
    .owned-check-wrap span { font-size: 9px; color: var(--muted); margin-top: 1px; }

    .card-main-info { min-width: 0; flex: 1; }
    .card-jp { font-size: 13.5px; font-weight: 700; color: #ffffff; word-break: break-word; }
    .card-en { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deck-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .card-price { font-size: 12.5px; font-weight: 700; }

    .mini-action-btn {
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card-sub); color: #cbd5e1; font-size: 10.5px; font-weight: 600; cursor: pointer;
    }

    .krark-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .select-box { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--card-sub); color: var(--text); }
    .flip-result-box { background: var(--card-sub); border: 1px solid var(--border); border-radius: 11px; padding: 12px; margin-top: 10px; }
    .hand-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; }
    .hand-card-row {
      background: var(--card-sub); border: 1px solid var(--border); border-radius: 9px;
      padding: 8px 11px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }

    .export-area {
      width: 100%; height: 150px; font-size: 13px; padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); background: #070a12; color: #e2e8f0; margin-top: 8px; resize: vertical;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(18, 24, 38, 0.95); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    }
    .bottom-nav-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 60px; }
    .nav-btn {
      background: none; border: none; color: var(--muted); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 700; cursor: pointer; position: relative;
    }
    .nav-btn.active { color: #10b981; }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-badge {
      position: absolute; top: 5px; right: calc(50% - 22px);
      background: var(--green); color: #090d16; font-size: 9.5px; font-weight: 800; padding: 1px 5px;
